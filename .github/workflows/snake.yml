name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 2 * * *"    # runs every day at 02:00 UTC
  workflow_dispatch:         # allows manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: khushi-nirsang
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-orange.svg?color_snake=#ff003c&color_dots=#120206,#28040a,#3d0610,#ff003c,#ff3300

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
