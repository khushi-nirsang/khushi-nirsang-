<g class="badge" style="animation-delay:.9s" transform="translate(68,168)"><rect width="110" height="34" rx="9" fill="#180408" stroke="#ff003c" stroke-width="1.2"/><text x="55" y="22" text-anchor="middle" font-size="12" fill="#ff003c" font-weight="bold">💥 Metasploit</text></g>
<g class="badge" style="animation-delay:.97s" transform="translate(188,168)"><rect width="96" height="34" rx="9" fill="#180408" stroke="#ff3300" stroke-width="1.2"/><text x="48" y="22" text-anchor="middle" font-size="12" fill="#ff3300" font-weight="bold">💉 SQLmap</text></g>
<g class="badge" style="animation-delay:1.04s" transform="translate(294,168)"><rect width="84" height="34" rx="9" fill="#180408" stroke="#ff9900" stroke-width="1.2"/><text x="42" y="22" text-anchor="middle" font-size="12" fill="#ff9900" font-weight="bold">💧 Hydra</text></g>
<g class="badge" style="animation-delay:1.11s" transform="translate(388,168)"><rect width="96" height="34" rx="9" fill="#180408" stroke="#ff003c" stroke-width="1.2"/><text x="48" y="22" text-anchor="middle" font-size="12" fill="#ff003c" font-weight="bold">🔓 Hashcat</text></g>
<g class="badge" style="animation-delay:1.18s" transform="translate(494,168)"><rect width="128" height="34" rx="9" fill="#180408" stroke="#ff3300" stroke-width="1.2"/><text x="64" y="22" text-anchor="middle" font-size="11" fill="#ff3300" font-weight="bold">🚀 Cobalt Strike</text></g>
