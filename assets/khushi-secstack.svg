<g class="badge" style="animation-delay:1.75s" transform="translate(638,248)"><rect width="94" height="34" rx="9" fill="#180408" stroke="#ff9900" stroke-width="1.2"/><text x="47" y="22" text-anchor="middle" font-size="12" fill="#ff9900" font-weight="bold">👑 PrivEsc</text></g>

<!-- LANGUAGES & RED TEAM OS -->
<text class="cat" x="450" y="318" text-anchor="middle" font-size="11" fill="#8a99a8" letter-spacing="3" style="animation-delay:1.8s">LANGUAGES &amp; OPERATING SYSTEMS</text>
<g class="badge" style="animation-delay:1.9s" transform="translate(78,328)"><rect width="88" height="34" rx="9" fill="#0a1f38" stroke="#3b82f6" stroke-width="1.2"/><text x="44" y="22" text-anchor="middle" font-size="12" fill="#60a5fa" font-weight="bold">🐍 Python</text></g>
