<g class="badge" style="animation-delay:1.4s" transform="translate(68,248)"><rect width="112" height="34" rx="9" fill="#180408" stroke="#ff003c" stroke-width="1.2"/><text x="56" y="22" text-anchor="middle" font-size="12" fill="#ff003c" font-weight="bold">🩸 BloodHound</text></g>
<g class="badge" style="animation-delay:1.47s" transform="translate(190,248)"><rect width="98" height="34" rx="9" fill="#180408" stroke="#ff3300" stroke-width="1.2"/><text x="49" y="22" text-anchor="middle" font-size="12" fill="#ff3300" font-weight="bold">🐱 Mimikatz</text></g>
