<g class="badge" style="animation-delay:2.18s" transform="translate(474,328)"><rect width="90" height="34" rx="9" fill="#180408" stroke="#ff003c" stroke-width="1.2"/><text x="45" y="22" text-anchor="middle" font-size="12" fill="#ff003c" font-weight="bold">🐧 Kali Linux</text></g>
<g class="badge" style="animation-delay:2.25s" transform="translate(574,328)"><rect width="96" height="34" rx="9" fill="#180408" stroke="#ff3300" stroke-width="1.2"/><text x="48" y="22" text-anchor="middle" font-size="12" fill="#ff3300" font-weight="bold">🦜 Parrot OS</text></g>

<!-- Footer -->
<text class="cat" x="450" y="398" text-anchor="middle" font-size="10" fill="#4a5a6a" letter-spacing="2" style="animation-delay:2.4s">EXPLOITDB ◆ OWASP TOP10 ◆ MITRE ATT&amp;CK ◆ KERBEROASTING ◆ COMMAND &amp; CONTROL</text>
