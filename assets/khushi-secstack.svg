<g class="badge" style="animation-delay:.63s" transform="translate(482,90)"><rect width="90" height="34" rx="9" fill="#180408" stroke="#ff3300" stroke-width="1.2"/><text x="45" y="22" text-anchor="middle" font-size="12" fill="#ff3300" font-weight="bold">🌐 Amass</text></g>
<g class="badge" style="animation-delay:.70s" transform="translate(582,90)"><rect width="104" height="34" rx="9" fill="#180408" stroke="#ff9900" stroke-width="1.2"/><text x="52" y="22" text-anchor="middle" font-size="12" fill="#ff9900" font-weight="bold">🦈 Wireshark</text></g>
<g class="badge" style="animation-delay:.77s" transform="translate(696,90)"><rect width="82" height="34" rx="9" fill="#180408" stroke="#ff003c" stroke-width="1.2"/><text x="41" y="22" text-anchor="middle" font-size="12" fill="#ff003c" font-weight="bold">🕵 OSINT</text></g>

