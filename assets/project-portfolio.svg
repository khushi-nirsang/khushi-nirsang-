<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img">
<defs>
<style>
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes glow { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
.card { animation: float 4.8s ease-in-out .8s infinite; transform-origin: center; }
.border-glow { animation: glow 3.5s ease-in-out infinite; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
<linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#180408"/><stop offset="100%" stop-color="#080103"/></linearGradient>
<linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff003c"/><stop offset="100%" stop-color="#ff9900"/></linearGradient>
</defs>
<g class="card">
  <rect x="10" y="10" width="280" height="200" rx="12" fill="url(#bg3)" stroke="url(#accent3)" stroke-width="1.5" class="border-glow"/>
  <text x="30" y="45" font-size="20">🎯</text>
  <text x="60" y="42" font-size="16" font-weight="bold" fill="#e2e8f0">Red Team Hub</text>
  <text x="30" y="65" font-size="12" fill="#ff9900" font-style="italic">Attack Ops &amp; Portfolio</text>
  <foreignObject x="30" y="80" width="240" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: sans-serif; font-size: 11.5px; line-height: 1.4;">
      Red Team portfolio &amp; research hub showcasing cyber attack simulations, vulnerability reports, &amp; exploit writeups.
    </div>
  </foreignObject>
  <rect x="30" y="145" width="60" height="20" rx="10" fill="#28040a" stroke="#ff003c" stroke-width="1"/>
  <text x="60" y="159" font-size="10" fill="#ff9900" text-anchor="middle">HTML/CSS</text>
  <rect x="96" y="145" width="40" height="20" rx="10" fill="#28040a" stroke="#ff3300" stroke-width="1"/>
  <text x="116" y="159" font-size="10" fill="#ff9900" text-anchor="middle">JS</text>
  <rect x="142" y="145" width="62" height="20" rx="10" fill="#28040a" stroke="#ff9900" stroke-width="1"/>
  <text x="173" y="159" font-size="10" fill="#ff9900" text-anchor="middle">RedTeam</text>
  <rect x="30" y="175" width="240" height="25" rx="6" fill="url(#accent3)"/>
  <text x="150" y="192" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">VISIT PORTFOLIO</text>
</g>
</svg>